name: Test deployed website

on:
  push:
    branches: [draft-preview, main]
    paths: ['content/**', 'src/**', 'public/**', 'scripts/**', 'qa/**', 'site.config.mjs', '.github/workflows/browser-preview.yml']
  workflow_dispatch:
    inputs:
      preview_url:
        description: Website origin in this Cloudflare Pages project
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Install isolated browser QA tools
        run: npm install --prefix qa --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: node qa/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Check deployed draft
        env:
          PREVIEW_URL: ${{ inputs.preview_url || (github.ref_name == 'main' && 'https://index-landing-3yn.pages.dev' || '') }}
          SITE_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
        run: npm run check:browser
      - name: Inspect public settings
        env:
          PREVIEW_URL: ${{ inputs.preview_url || (github.ref_name == 'main' && 'https://index-landing-3yn.pages.dev' || '') }}
          SITE_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
        run: node qa/preview-settings.mjs
      - name: Save screenshots and results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cloudflare-website-browser-results
          path: artifacts/browser/
          retention-days: 7
          if-no-files-found: ignore
